name: Build and Release

# Pushing a tag vX.Y.Z (git tag v1.0.7 && git push origin v1.0.7) builds that version, then
# creates the GitHub release "Release v1.0.7" with generated notes and the packages attached.
# Pushes to main, pull requests and manual runs do the same tests and builds with version
# 0.0.<run number>, kept as workflow artifacts only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

env:
  WAILS_VERSION: v2.15.0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      msix_version: ${{ steps.version.outputs.msix_version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: packaging/ci-version.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The GUI package links against GTK and WebKitGTK even for vet and tests.
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet
        run: go vet -tags webkit2_41 ./...
      - name: Test
        run: go test -tags webkit2_41 -race ./...

  linux:
    needs: [version, test]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm] # amd64 and arm64 packages
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION
      - run: packaging/build-deb.sh "${{ needs.version.outputs.version }}" all
      - uses: actions/upload-artifact@v7
        with:
          name: uencrypt-deb-${{ matrix.runner }}
          path: artifacts/deb/*.deb

  msix:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      # Unsigned: for Store submission (the Store signs it). Set the identity values from
      # Partner Center as repository variables before submitting.
      - name: Build MSIX
        shell: pwsh
        run: >
          ./packaging/build-msix.ps1
          -Version "${{ needs.version.outputs.msix_version }}"
          -Architecture x64,arm64
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'uencrypt.dev' }}"
          -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=uencrypt-dev' }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'uencrypt developer' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: uencrypt-msix
          path: artifacts/msix/*.msix

  release:
    # Only for version tags, and only once every build has succeeded.
    if: needs.version.outputs.is_release == 'true'
    needs: [version, linux, msix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/*.msix
            dist/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
